name: Etiqa Sales Hub CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: etiqa-sales-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-api:
    name: Backend API (Build, Test & Quality Gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests, SpotBugs, PMD and JaCoCo coverage gate
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-test-and-coverage-reports
          path: |
            sales-api/target/site/jacoco/
            sales-api/target/surefire-reports/

  web-frontend:
    name: Web Frontend (Lint, Type-Check, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sales-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Type-check with TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests with Vitest
        run: npm test

      - name: Build production bundle
        run: npm run build

  docker-stack-smoke-test:
    name: Docker Stack Integration Smoke Test
    needs: [backend-api, web-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env with a fresh JWT secret
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env

      - name: Validate core and observability compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

      - name: Build API and UI images
        run: docker compose build

      - name: Start the stack and wait until every container is healthy
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke-test the UI, the API through the UI proxy, and API health
        run: |
          curl -fsS http://localhost:5174/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5174/api/v1/products > /dev/null
          curl -fsS http://localhost:8085/actuator/health | grep -q UP

      - name: Print container logs when a step fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack and remove volumes
        if: always()
        run: docker compose down -v
